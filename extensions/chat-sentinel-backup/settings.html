<div id="chat_sentinel_backup_settings" class="inline-drawer chat_sentinel_entry_panel">
    <button type="button" class="inline-drawer-toggle inline-drawer-header chat_sentinel_entry_header">
        <span class="chat_sentinel_entry_title">
            <span class="fa-solid fa-shield-halved" aria-hidden="true"></span>
            <strong>聊天守护</strong>
        </span>
        <span class="inline-drawer-icon fa-solid fa-circle-chevron-down down" aria-hidden="true"></span>
    </button>
    <div class="inline-drawer-content chat_sentinel_entry">
        <div class="chat_sentinel_entry_summary">
            <div class="chat_sentinel_entry_health" role="status" aria-live="polite">
                <span id="chat_sentinel_health_dot" class="chat_sentinel_health_dot" aria-hidden="true"></span>
                <span id="chat_sentinel_entry_status">正在检查本地存储…</span>
            </div>
            <button id="chat_sentinel_open_manager" class="menu_button chat_sentinel_entry_action chat_sentinel_primary">
                <span class="fa-solid fa-shield-halved" aria-hidden="true"></span>
                <span>打开聊天守护</span>
            </button>
        </div>
        <p class="chat_sentinel_entry_hint">只在本机从已落盘聊天创建独立快照，不上传聊天内容。</p>
    </div>
</div>
